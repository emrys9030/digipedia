<div class="list-group list-group-flush">
  {% for d in digimons %}
    <div class="list-group-item px-0 py-3">
      <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
          <div class="fw-semibold">
            <span class="text-muted small">#{{ d.id }}</span> {{ d.name }}
          </div>
          <small class="text-muted">{{ d.stage }} &bull; {{ d.element }} &bull; {{ d.role }}</small>
        </div>
        <a
          href="{% url 'digimon-update' d.id %}"
          class="btn btn-sm btn-outline-secondary"
        >
          Düzenle
        </a>
      </div>
      <div class="mt-2 d-flex gap-1 flex-wrap">
        <span class="badge bg-dark-subtle text-dark">{{ d.rank }}</span>
        <span class="badge bg-info-subtle text-info-emphasis">{{ d.attr }}</span>
        <span class="badge bg-secondary-subtle text-secondary-emphasis">
          {{ d.skills.count }} Skill
        </span>
      </div>
    </div>
  {% empty %}
    <div class="text-muted small py-3">Henüz kayıtlı Digimon yok.</div>
  {% endfor %}
</div>
