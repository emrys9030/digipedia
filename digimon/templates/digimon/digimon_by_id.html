<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digipedia — ID'ye Göre Digimon Ara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body style="background-color: #f4f6f9;">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'digimon-list-ui' %}">Digipedia</a>
      <div class="d-flex flex-wrap gap-2">
        <a href="{% url 'digimon-list-ui' %}" class="btn btn-sm btn-outline-light">Tüm Liste</a>
        <a href="{% url 'digimon-by-name-ui' %}" class="btn btn-sm btn-outline-light">İsme Göre</a>
        <a href="{% url 'digimon-by-id-ui' %}" class="btn btn-sm btn-primary">ID'ye Göre</a>
        <a href="{% url 'digimon-create' %}" class="btn btn-sm btn-outline-success">+ Yeni Ekle</a>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
      <h1 class="h4 fw-bold mb-1">ID'ye Göre Digimon Getir</h1>
      <p class="text-muted small mb-3">
        API Endpoint: <code>GET /api/digimons/by-id/&lt;id&gt;/</code>
      </p>

      <form method="get" class="row g-2">
        <div class="col-sm-9 col-md-10">
          <input
            type="number"
            name="id"
            min="1"
            value="{{ query_id }}"
            class="form-control form-control-lg"
            placeholder="Örn: 12"
            required
          />
        </div>
        <div class="col-sm-3 col-md-2 d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Getir</button>
        </div>
      </form>
    </div>

    {% if error_message %}
      <div class="alert alert-danger rounded-3 shadow-sm">{{ error_message }}</div>
    {% endif %}

    {% if json_output %}
      {% include "digimon/partials/json_viewer.html" %}
    {% endif %}
  </main>
</body>
</html>
